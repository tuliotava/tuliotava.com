:root {

* { box-sizing: border-box; }

.page { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 1px dashed var(--ink); outline-offset: 2px; }

.bar { width: 100%; display: flex; justify-content: space-between; align-items: center; color: var(--ink-dim); letter-spacing: 0.04em; }
.who { color: var(--ink); letter-spacing: 0.32em; font-size: 12px; }

.frame { position: relative; display: flex; flex-direction: column; gap: 5px; }

.vb { min-width: 40px; min-height: 30px; padding: 2px 6px; color: var(--orange); font-size: 11px; letter-spacing: 0.08em;

.ttl { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--win-title); color: #fff; padding: 2px 3px 2px 6px; font-weight: 700; font-size: 11px; cursor: grab; touch-action: none; user-select: none; }

    ctx.fillStyle = "rgba(232,215,174,0.45)";
    ctx.beginPath(); ctx.ellipse(-u * 0.55, -u * 0.6, u * 0.55, u * (0.2 + 0.45 * flap), -0.5, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(u * 0.55, -u * 0.6, u * 0.55, u * (0.2 + 0.45 * flap), 0.5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = COLOR[1];
    ctx.beginPath(); ctx.arc(0, 0, u * 0.48, 0, 6.2832); ctx.arc(u * 0.7, u * 0.1, u * 0.32, 0, 6.2832); ctx.fill();
    ctx.restore();
    if (t < fly.dazed) {                       // little dizzy stars
      ctx.fillStyle = COLOR[2];
      for (var s = 0; s < 3; s++) { var a = t * 0.008 + s * 2.094; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * u * 1.6, f.y - u * 1.2 + Math.sin(a) * u * 0.5, u * 0.22, 0, 6.2832); ctx.fill(); }
    }
  }
  function drawPops(t) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var i = pops.length - 1; i >= 0; i--) {
      var p = pops[i], age = (t - p.t) / 700;
      if (age > 1) { pops.splice(i, 1); continue; }
      var q = G(p.c, p.r);
      ctx.globalAlpha = 1 - age; ctx.fillStyle = COLOR[2];
      ctx.font = "500 " + Math.max(11, W * 0.034).toFixed(1) + "px " + monoFont;
      ctx.fillText(T[lang].hit, q.x, q.y - 14 - age * 16);
      ctx.globalAlpha = 1;
    }
  }
  function drawFlag(t) {
    var k = warnOpen ? Math.min(1, (t - balloonT) / 700) : Math.max(0, 1 - (t - balloonT) / 380);
    if (reduce) k = warnOpen ? 1 : 0;
    if (k <= 0) return;
    var u = unit(), e2 = function (x) { return 1 - Math.pow(1 - x, 3); };
    var root = G(13, 146), bend = G(24, 140), top = G(24, 117);
    var g1 = e2(Math.min(1, k * 2)), g2 = e2(Math.max(0, k * 2 - 1));
    ctx.strokeStyle = COLOR[3]; ctx.lineCap = "round"; ctx.lineWidth = Math.max(1.4, u * 0.55);
    ctx.beginPath(); ctx.moveTo(root.x, root.y);
    var bx = root.x + (bend.x - root.x) * g1, by = root.y + (bend.y - root.y) * g1;
    ctx.lineTo(bx, by);
    var ty = bend.y + (top.y - bend.y) * g2;
    if (g2 > 0) ctx.lineTo(bend.x, ty);
    ctx.stroke();
    if (g2 < 0.98) return;
    var lines = T[lang].flag, fs = Math.max(10, W * 0.031);
    ctx.font = "500 " + fs.toFixed(1) + "px " + monoFont;
    var tw = Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width);
    var fw = tw + fs * 1.2, fh = fs * 2.7, x0 = bend.x + 1, y0 = top.y;
    var wave = function (yy, s) { return Math.sin(t * 0.006 + s * 3 + yy * 0.05) * fs * 0.18; };
    ctx.fillStyle = COLOR[1]; ctx.beginPath();
    ctx.moveTo(x0, y0);
    for (var s = 0; s <= 1.0001; s += 0.1) ctx.lineTo(x0 + fw * s, y0 + wave(0, s) * s);
    for (var s2 = 1; s2 >= -0.0001; s2 -= 0.1) ctx.lineTo(x0 + fw * s2, y0 + fh + wave(fh, s2) * s2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = BG; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(lines[0], x0 + fs * 0.6, y0 + fh * 0.32 + wave(fh * 0.3, 0.3) * 0.3);
    ctx.fillText(lines[1], x0 + fs * 0.6, y0 + fh * 0.7 + wave(fh * 0.7, 0.3) * 0.3);
    ctx.fillStyle = COLOR[1]; ctx.globalAlpha = 0.65;
    ctx.font = "400 " + (fs * 0.82).toFixed(1) + "px " + monoFont;
    ctx.fillText("(" + T[lang].brinks + ")", x0 + fs * 0.2, y0 + fh + fs * 1.1);
    ctx.globalAlpha = 1;
  }
  var raf = 0;
  function loop(t) { frame(t); raf = requestAnimationFrame(loop); }
  function start() { if (!raf && !reduce) raf = requestAnimationFrame(loop); }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function poke() { if (!reduce) return; var n = 0; (function settle() { frame(performance.now()); if (++n < 40) requestAnimationFrame(settle); })(); }
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else start(); });

  var live = document.getElementById("live");
  function local(ev) { var rect = cv.getBoundingClientRect(); return { x: ev.clientX - rect.left, y: ev.clientY - rect.top }; }
  function pad(n) { n = Math.max(0, Math.round(n)); return ("00" + n).slice(-3); }
  function readout(x, y) { var g = toGrid(x, y); live.textContent = "X: " + pad(g.c) + " Y: " + pad(g.r); }
  var downAt = 0, downPos = null;
  cv.addEventListener("pointerdown", function (ev) {
    var q = local(ev); pointer.x = q.x; pointer.y = q.y; pointer.on = true; downAt = performance.now(); downPos = q; readout(q.x, q.y);
    var g = toGrid(q.x, q.y);
    if (inTail(g.c, g.r)) {
      var p = polar(g.c, g.r);
      tail.drag = true; tail.grabPhi = p.a; tail.grabTh = tail.th; tail.grabF = Math.max(0.25, Math.min(1, p.d / 80)); tail.target = tail.th;
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    poke();
  });
  cv.addEventListener("pointermove", function (ev) {
    var q = local(ev); pointer.x = q.x; pointer.y = q.y;
    if (ev.pointerType === "mouse") pointer.on = true;
    readout(q.x, q.y);
    if (tail.drag) {
      var g = toGrid(q.x, q.y), p = polar(g.c, g.r), da = p.a - tail.grabPhi;
      if (da > Math.PI) da -= 6.2832; if (da < -Math.PI) da += 6.2832;
      tail.target = Math.max(-0.75, Math.min(0.55, tail.grabTh + da / tail.grabF));
    }
    poke();
  });
  function up(ev) {
    var q = local(ev);
    if (!tail.drag && downPos && performance.now() - downAt < 260 && Math.hypot(q.x - downPos.x, q.y - downPos.y) < 8) shiver = 1;
    tail.drag = false;
    if (ev.pointerType !== "mouse") { pointer.on = false; live.textContent = "X: --- Y: ---"; }
    downPos = null; poke();
  }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
  cv.addEventListener("pointerleave", function () { if (!tail.drag) { pointer.on = false; live.textContent = "X: --- Y: ---"; } poke(); });

  // ---------- chrome ----------
  var fliesEl = document.getElementById("flies"), verBtns = document.querySelectorAll(".vb");
  function updateStatus() { fliesEl.innerHTML = "<b>" + swats + "</b> " + T[lang].fliesShort; }
  function updateText() {
    updateStatus();
    for (var i = 0; i < verBtns.length; i++) verBtns[i].setAttribute("aria-pressed", verBtns[i].getAttribute("data-mode") === mode ? "true" : "false");
  }
  for (var vi = 0; vi < verBtns.length; vi++) verBtns[vi].addEventListener("click", function () {
    var m = this.getAttribute("data-mode"); if (m === mode) return;
    mode = m; build(); frame(performance.now());
  });

  // ---------- links on the body ----------
  var stage = document.getElementById("stage"), crumbEl = document.getElementById("crumb");
  var open = {}, path = [], fresh = {}, win = null, winNode = null, winPos = null;
  function slug(n) { return lang === "en" && n.en_id ? n.en_id : n.id; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function renderPins() {
    var olds = stage.querySelectorAll(".pin"); for (var i = 0; i < olds.length; i++) olds[i].remove();
    TREE.forEach(function (n) {
      var pin = el("div", "pin" + (n.pin.right ? " right" : ""));
      pin.style.left = (n.pin.c / COLS * 100) + "%";
      pin.style.top = (n.pin.r / ROWS * 100) + "%";
      var b = el("button", "lbl" + (fresh[n.id] ? " grow" : ""));
      b.type = "button";
      b.appendChild(el("span", "t", n[lang]));
      b.setAttribute("aria-expanded", open[n.id] || (winNode === n) ? "true" : "false");
      b.addEventListener("click", function () { hit(n, [n], 0); });
      pin.appendChild(b);
      if (open[n.id] && n.kids) {
        var box = el("div", "kids");
        n.kids.forEach(function (k, i) { renderKid(box, k, [], i === n.kids.length - 1, [n, k]); });
        pin.appendChild(box);
      }
      stage.appendChild(pin);
    });
    renderCrumb();
    fresh = {};
  }
  function renderKid(box, n, guides, isLast, trail) {
    var row = el("div", "kid" + (fresh[n.id] ? " grow" : ""));
    row.appendChild(el("span", "pre", guides.map(function (g) { return g ? "    " : "│   "; }).join("") + (isLast ? "└── " : "├── ")));
    var hasKids = !!(n.kids && n.kids.length);
    var b = el("button", hasKids ? "dir" : "leaf", n[lang] + (hasKids ? "/" : ""));
    b.type = "button";
    b.setAttribute("aria-expanded", open[n.id] || winNode === n ? "true" : "false");
    b.addEventListener("click", function () { hit(n, trail); });
    row.appendChild(b);
    box.appendChild(row);
    if (hasKids && open[n.id]) n.kids.forEach(function (k, i) { renderKid(box, k, guides.concat([isLast]), i === n.kids.length - 1, trail.concat([k])); });
  }
  function closeDown(n) { open[n.id] = false; if (n.kids) n.kids.forEach(closeDown); }
  function hit(n, trail) {
    if (n.kids && n.kids.length) {
      var willOpen = !open[n.id];
      if (trail.length === 1) TREE.forEach(function (t) { if (t !== n) closeDown(t); });  // one branch at a time
      if (willOpen) { open[n.id] = true; fresh[n.id] = !n.pin; n.kids.forEach(function (k) { fresh[k.id] = true; }); path = trail.slice(); }
      else { closeDown(n); path = trail.slice(0, -1); }
      closeWin();
      renderPins();
    } else {
      if (trail.length === 1) TREE.forEach(function (t) { if (t !== n) closeDown(t); });
      path = trail.slice(0, -1);
      if (n.balloon) raiseFlag(n, trail); else openWin(n, trail);
    }
  }

  // ---------- windows: one per project, pages you swipe ----------
  var page = 0;
  function openWin(n, trail) {
    closeWin(true);
    winNode = n; winNode.trail = trail; page = 0;
    win = el("div", "win pop");
    win.setAttribute("role", "dialog");
    win.tabIndex = -1;
    var ttl = el("div", "ttl");
    ttl.appendChild(el("span", null, slug(n) + ".txt"));
    var btns = el("div", "wbtns");
    var mn = el("span", "wb", "_"); mn.setAttribute("aria-hidden", "true");
    var mx = el("span", "wb", "□"); mx.setAttribute("aria-hidden", "true");
    var x = el("button", "wb x", "×"); x.type = "button"; x.setAttribute("aria-label", T[lang].close);
    x.addEventListener("click", function () { closeWin(); });
    btns.appendChild(mn); btns.appendChild(mx); btns.appendChild(x);
    ttl.appendChild(btns);
    win.appendChild(ttl);
    var body = el("div", "wbody"); body.id = "wbody";
    win.appendChild(body);
    var nav = el("div", "wnav");
    var prev = el("button", "wb arrow", "◀"); prev.type = "button"; prev.setAttribute("aria-label", T[lang].prev);
    var count = el("span", "wcount");
    var next = el("button", "wb arrow", "▶"); next.type = "button"; next.setAttribute("aria-label", T[lang].next);
    prev.addEventListener("click", function () { go(-1); });
    next.addEventListener("click", function () { go(1); });
    nav.appendChild(prev); nav.appendChild(count); nav.appendChild(next);
    win.appendChild(nav);
    win.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeWin();
      else if (e.key === "ArrowRight") { go(1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(-1); e.preventDefault(); }
    });
    swipe(body);
    stage.appendChild(win);
    renderPage(0);
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if (n.balloon) winPos = { x: (sw - win.offsetWidth) / 2, y: sh * 0.5 };
    else if (!winPos) winPos = { x: (sw - win.offsetWidth) / 2, y: sh * 0.06 };
    placeWin(winPos.x, winPos.y);
    dragify(ttl);
    renderPins();
    win.focus({ preventScroll: true });
  }
  function go(d) {
    var pages = winNode.pages, np = Math.max(0, Math.min(pages.length - 1, page + d));
    if (np === page) return;
    renderPage(np, d);
  }
  function renderPage(i, dir) {
    page = i;
    var pg = winNode.pages[i], body = win.querySelector(".wbody");
    body.innerHTML = "";
    var box = el("div", "pg" + (dir ? (dir > 0 ? " in-r" : " in-l") : ""));
    if (pg.img) { var im = el("img"); im.src = IMG[pg.img]; im.alt = ""; im.className = "wimg"; im.draggable = false; box.appendChild(im); }
    if (pg.big) box.appendChild(el("p", "big", pg.big[lang]));
    if (pg.h) box.appendChild(el("h3", "wh", pg.h[lang]));
    if (pg.meta) box.appendChild(el("p", "wmeta", pg.meta[lang]));
    if (pg.quote) { var q = el("p", "q", QUOTE[lang]); q.appendChild(el("cite", null, "Tim O'Reilly")); box.appendChild(q); }
    (pg.p || []).forEach(function (t) { box.appendChild(el("p", pg.draft ? "dim" : null, t[lang])); });
    if (pg.list) { var ul = el("ul", "wlist"); pg.list.forEach(function (t) { ul.appendChild(el("li", null, t[lang])); }); box.appendChild(ul); }
    if (pg.link) { var a = el("a", "wlink", pg.link.label[lang]); a.href = pg.link.href; a.target = "_blank"; a.rel = "noopener"; box.appendChild(a); }
    if (pg.mail) box.appendChild(el("p", "wmail", "tulio@tuliotava.com"));
    body.appendChild(box);
    body.scrollTop = 0;
    var n = winNode.pages.length;
    win.querySelector(".wcount").textContent = (i + 1) + " / " + n;
    var arrows = win.querySelectorAll(".arrow");
    arrows[0].disabled = i === 0; arrows[1].disabled = i === n - 1;
    win.querySelector(".wnav").hidden = n < 2;
    win.setAttribute("aria-label", slug(winNode) + ".txt, " + (i + 1) + " / " + n);
    renderCrumb();
  }
  function swipe(target) {
    var sx = 0, sy = 0, on = false;
    target.addEventListener("pointerdown", function (e) { on = true; sx = e.clientX; sy = e.clientY; });
    target.addEventListener("pointerup", function (e) {
      if (!on) return; on = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
    });
    target.addEventListener("pointercancel", function () { on = false; });
  }
  function placeWin(x, y) {
    var sw = stage.clientWidth, sh = stage.clientHeight;
    x = Math.max(-8, Math.min(sw - win.offsetWidth + 8, x)); y = Math.max(-8, Math.min(sh - 80, y));
    win.style.left = x + "px"; win.style.top = y + "px"; winPos = { x: x, y: y };
  }
  function dragify(handle) {
    var sx = 0, sy = 0, ox = 0, oy = 0, on = false;
    handle.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".wb")) return;
      on = true; sx = e.clientX; sy = e.clientY; ox = winPos.x; oy = winPos.y;
      try { handle.setPointerCapture(e.pointerId); } catch (er) {}
      handle.style.cursor = "grabbing";
    });
    handle.addEventListener("pointermove", function (e) { if (on) placeWin(ox + e.clientX - sx, oy + e.clientY - sy); });
    function end() { on = false; handle.style.cursor = ""; }
    handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
  }
  var flagTimer = 0;
  function closeWin(keepPins) {
    if (win) { win.remove(); win = null; }
    if (!keepPins && warnOpen) { warnOpen = false; balloonT = performance.now(); }
    winNode = null;
    if (!keepPins) { renderPins(); if (reduce) frame(performance.now()); }
  }
  // the warning: the tongue raises a flag first, the right phrase comes after
  function raiseFlag(n, trail) {
    clearTimeout(flagTimer);
    closeWin(true);
    warnOpen = true; balloonT = performance.now();
    renderPins();
    if (reduce) frame(performance.now());
    flagTimer = setTimeout(function () { openWin(n, trail); }, reduce ? 0 : 1500);
  }
  function renderCrumb() {
    crumbEl.innerHTML = "";
    var root = el("button", null, "~/tuliotava/"); root.type = "button";
    root.addEventListener("click", function () { TREE.forEach(closeDown); path = []; closeWin(); });
    crumbEl.appendChild(root);
    path.forEach(function (n, i) {
      var b = el("button", null, slug(n) + "/"); b.type = "button";
      b.addEventListener("click", function () { if (n.kids) n.kids.forEach(closeDown); path = path.slice(0, i + 1); closeWin(); });
      crumbEl.appendChild(b);
    });
    if (winNode) crumbEl.appendChild(el("span", null, slug(winNode) + ".txt"));
  }

  // ---------- vertical ticker: a phrase runs the full height, then the next one ----------
  var vt = document.getElementById("vt"), tickMsgs = [], tickI = -1, tickAnim = null;
  var vt2 = document.getElementById("vt2"), tickAnim2 = null;
  function nextTick() {
    var one = tickMsgs.map(function (m) { return "→ " + m + "   ·   "; }).join("");
    vt.textContent = one + one; vt2.textContent = one + one;     // twice each, for a seamless loop
    if (tickAnim) tickAnim.cancel(); if (tickAnim2) tickAnim2.cancel();
    if (reduce || !vt.animate) { vt.style.transform = vt2.style.transform = "none"; return; }
    var half = (vt.offsetHeight || 1200) / 2, ms = half * 13;
    tickAnim = vt.animate([{ transform: "translateY(0)" }, { transform: "translateY(" + (-half) + "px)" }], { duration: ms, iterations: Infinity, easing: "linear" });
    // left side runs the other way
    tickAnim2 = vt2.animate([{ transform: "translateY(" + (-half) + "px)" }, { transform: "translateY(0)" }], { duration: ms, iterations: Infinity, easing: "linear" });
  }

  // ---------- language ----------
  var langBtns = document.querySelectorAll(".lang button");
  function setLang(l) {
    lang = l;
    try { localStorage.setItem("tos-lang", l); } catch (e) {}
    document.documentElement.lang = l === "pt" ? "pt-BR" : "en";
    for (var i = 0; i < langBtns.length; i++) langBtns[i].setAttribute("aria-pressed", langBtns[i].getAttribute("data-lang") === l ? "true" : "false");
    cv.setAttribute("aria-label", T[l].aria);
    document.getElementById("plaque").innerHTML = T[l].plaque;
    var it = T[l].intro, intro = document.getElementById("intro");
    intro.innerHTML = "<div class=\"cols3\"><div><h1>" + it[0] + "</h1></div><div><p>" + it[1] + "</p><p class=\"fly\">" + it[2] + "</p></div><div><p>" + it[3] + "</p></div></div>" +
      "<div class=\"complain\"><span>" + it[4] + "</span><div class=\"mailrow\"><span class=\"addr\" id=\"addr\">tulio@tuliotava.com</span><button type=\"button\" class=\"copy\" id=\"copy\">" + T[l].copy + "</button></div></div>";
    document.getElementById("copy").addEventListener("click", function () {
      var b = this, done = function () { b.textContent = T[lang].copied; setTimeout(function () { b.textContent = T[lang].copy; }, 1600); };
      var sel = function () { var r = document.createRange(); r.selectNodeContents(document.getElementById("addr")); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText("tulio@tuliotava.com").then(done, sel); } catch (e) { sel(); }
    });
    tickMsgs = [T[l].hint, T[l].hint2, T[l].hint3]; nextTick();
    updateText();
    if (winNode) { var n = winNode, tr = winNode.trail; openWin(n, tr); } else renderPins();
    frame(performance.now());
  }
  for (var li = 0; li < langBtns.length; li++) langBtns[li].addEventListener("click", function () { setLang(this.getAttribute("data-lang")); });

  window.addEventListener("resize", function () { resize(); if (win) placeWin(winPos.x, winPos.y); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { monoFont = getComputedStyle(document.body).fontFamily; frame(performance.now()); });
  resize();
  setLang(lang);
  start();
})();

</script>
